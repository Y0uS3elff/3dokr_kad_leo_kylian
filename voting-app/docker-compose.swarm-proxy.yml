# Relay used only to test the Swarm cluster simulated with Docker-in-Docker.
# With Docker Desktop, the ports published by the "manager" node do not always
# answer from the host. This relay joins the swarm-lab network and forwards:
#   localhost:9080 -> manager:8080 (vote)
#   localhost:9081 -> manager:8081 (result)
#
# Start it after the nodes:  docker compose -f docker-compose.swarm-proxy.yml up -d
# Stop it:                   docker compose -f docker-compose.swarm-proxy.yml down

# Separate project name, so it does not mix with the main docker-compose.yml
name: swarm-proxy

services:
  swarm-proxy:
    image: alpine:3.20
    container_name: swarm-proxy
    command:
      - sh
      - -c
      - |
        apk add -q socat
        socat tcp-listen:9080,fork,reuseaddr tcp:manager:8080 &
        exec socat tcp-listen:9081,fork,reuseaddr tcp:manager:8081
    ports:
      - "9080:9080"
      - "9081:9081"
    networks:
      - swarm-lab
    restart: unless-stopped

networks:
  # Network created beforehand with: docker network create swarm-lab
  swarm-lab:
    external: true
