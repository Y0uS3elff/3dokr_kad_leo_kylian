name: swarm-proxy

services:
  swarm-proxy:
    image: alpine:3.20
    container_name: swarm-proxy
    command:
      - sh
      - -c
      - |
        apk add -q socat
        socat tcp-listen:9080,fork,reuseaddr tcp:manager:8080 &
        exec socat tcp-listen:9081,fork,reuseaddr tcp:manager:8081
    ports:
      - "9080:9080"
      - "9081:9081"
    networks:
      - swarm-lab
    restart: unless-stopped

networks:
  swarm-lab:
    external: true
